<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pressdent Group - Escanea el QR</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Georgia&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --dorado: #b89146;
      --dorado-texto: #a37b33;
      --gris-oscuro: #3e3f42;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #070707;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .qr-card {
      width: 100%;
      max-width: 400px;
      background: #fafafa;
      border-radius: 24px;
      box-shadow:
        0 0 0 1px rgba(255,215,120,.25),
        0 15px 45px rgba(0,0,0,.25),
        0 0 25px rgba(200,162,76,.20);
      overflow: hidden;
      text-align: center;
      padding: 40px 30px;
    }

    .brand-title {
      font-family: 'Georgia', serif;
      font-style: italic;
      font-size: 2rem;
      font-weight: 700;
      color: #63666a;
      letter-spacing: 1px;
      margin-bottom: 2px;
    }

    .brand-subtitle {
      font-family: 'Georgia', serif;
      font-style: italic;
      font-size: 1rem;
      letter-spacing: 6px;
      color: #FF8000;
      margin-bottom: 25px;
    }

    .qr-frame {
      background: #ffffff;
      border: 1px solid #e5e5e5;
      border-radius: 16px;
      padding: 16px;
      display: inline-block;
      margin-bottom: 22px;
    }

    .qr-frame img {
      width: 220px;
      height: 220px;
      display: block;
    }

    .qr-instruction {
      font-size: 0.95rem;
      color: #555555;
      font-weight: 500;
      line-height: 1.4;
    }

    .qr-instruction span {
      display: block;
      margin-top: 4px;
      font-size: 0.8rem;
      color: var(--dorado-texto);
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
  </style>
</head>
